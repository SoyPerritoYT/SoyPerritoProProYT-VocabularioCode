<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulario Code</title>
<style>
:root{color-scheme:dark;--card:#191e28;--accent:#7c5cff;--text:#f5f7ff;--muted:#aeb6c7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#10131a,#171225);color:var(--text);min-height:100vh}main{max-width:760px;margin:auto;padding:28px 18px}.card{background:var(--card);border:1px solid #2b3242;border-radius:20px;padding:22px}h1{margin:0 0 8px;font-size:clamp(26px,6vw,42px)}.muted{color:var(--muted)}select,textarea{width:100%;background:#0d1016;color:var(--text);border:1px solid #343c4e;border-radius:12px;padding:14px;font:inherit}select{margin:8px 0 12px}textarea{min-height:130px;resize:vertical}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:white;margin:8px 6px 0 0}.result{margin-top:14px;padding:16px;border-radius:12px;background:#0d1016;word-break:break-word;font-size:20px;min-height:28px}.support{margin-top:18px;padding:16px;border-radius:12px;background:#11151e;border:1px solid #2b3242}.support a{color:#b7a8ff;text-decoration:none;font-weight:700;display:block;margin-top:6px}.examples{margin-top:22px;padding-top:18px;border-top:1px solid #2b3242}.examples strong{display:block;margin-bottom:8px}.code-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#d9d4ff;margin:5px 0;word-break:break-all}
</style></head><body><main><section class="card"><h1>🐶 Vocabulario Code</h1><p class="muted">Traductor Español ↔ Code ↔ Japonés.</p>
<select id="mode" aria-label="Modo de traducción"><option value="es-code">🇪🇸 Español → 🔐 Code</option><option value="code-es">🔐 Code → 🇪🇸 Español</option><option value="es-ja">🇪🇸 Español → 🇯🇵 Japonés</option><option value="ja-es">🇯🇵 Japonés → 🇪🇸 Español</option><option value="ai">🤖 IA traductora</option><option value="ai-normal">🧠 IA normal</option></select>
<textarea id="input" placeholder="Escribe aquí..."></textarea><button id="translate">🔄 Traducir</button><div id="result" class="result">Aquí aparecerá el resultado.</div>
<div class="support"><strong>🛠️ Soporte</strong><a href="mailto:perritosoporte@outlook.com">perritosoporte@outlook.com</a><strong>🐶 Correo para subs</strong><a href="mailto:perritosubsexculusivo@outlook.com">perritosubsexculusivo@outlook.com</a></div>
<div class="examples"><strong>💡 Códigos disponibles:</strong><div id="examplesList"></div></div></section></main>
<script>
const words={"hola":"-9)@","abc":"@;'","xd":"\"€","es":"3#","aprende":"@043!€3","pokemon go":"09(3?9! &9","sí":"#8","te odio":"53 9€89","te odio muchísimo":"53 9€89 ?7'-8#8?9","me compras mil pavos porfa":"?3 '9?94@# ?8) 0@:9# 094€@","toy":"596","jugamos":"+7&@?9#","vamos":":@?9#","ahora":"@-94@","hazlo":"-@*)9","no me hables":"!9 ?3 -@;)3#","te amo":"53 @?9","misi":"?8#8","gato":"&@59","minecraft bedrock":"?8!3'4@_5 ;3€49'(","minecraft":"?8!3'4@_5","minecraft java":"?8!3'4@_5 +@:@","java":"+@:@","bedrock":";3€49'(","chatgpt":"'-@5&05","gemini":"&3?8!8","github":"&85-7;","fornite":"_94!853","perro":"03449","soy":"#96"};
const japanese={"hola":"こんにちは","perro":"犬","gato":"猫","sí":"はい","no":"いいえ","gracias":"ありがとう","adiós":"さようなら","buenos días":"おはよう","buenas noches":"こんばんは","amigo":"友達","juego":"ゲーム","minecraft":"マインクラフト","pokemon go":"ポケモンGO","te amo":"愛してる","aprende":"学ぶ","ahora":"今","vamos":"行こう","jugamos":"遊ぼう"};
const reverseCode=Object.fromEntries(Object.entries(words).map(([a,b])=>[b,a]));
const reverseJapanese=Object.fromEntries(Object.entries(japanese).map(([a,b])=>[b,a]));
const input=document.getElementById("input"),result=document.getElementById("result"),mode=document.getElementById("mode"),examplesList=document.getElementById("examplesList");

async function translate(){
  const v=input.value.trim();
  if(v.toLowerCase()==="SoyPerritoProProYT".toLowerCase() || v.toLowerCase()==="soyperritoproproyt"){
    result.textContent="🐶 SoyPerritoProProYT es un YouTuber con 36 subs y quiere llegar a los 50 subs. 🎯";
    return;
  }
  if(!v){result.textContent="Escribe algo primero 😎";return}
  if(mode.value==="ai-normal"){
    result.textContent="🧠 Pensando...";
    try{
      const response=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:v,targetLanguage:"español"})});
      const data=await response.json();
      if(!response.ok) throw new Error(data.error||"Error de la IA");
      result.textContent="🧠 "+(data.translation||"No recibí una respuesta.");
    }catch(error){
      result.textContent="❌ "+error.message;
    }
    return;
  }
  if(mode.value==="ai"){
    // Primero usamos el diccionario de Vocabulario Code.
    const localCode=reverseCode[v];
    // El código de xd es exactamente `"€` (comillas + euro), todo junto.
    if(localCode){
      result.textContent="🤖 "+localCode;
      return;
    }
    const localSpanish=words[v.toLowerCase()];
    if(localSpanish){
      result.textContent="🤖 "+localSpanish;
      return;
    }
    result.textContent="🤖 Pensando...";
    try{
      const response=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:v,targetLanguage:"español"})});
      const data=await response.json();
      if(!response.ok) throw new Error(data.error||"Error de la IA");
      result.textContent="🤖 "+(data.translation||"No recibí una respuesta.");
    }catch(error){
      result.textContent="❌ "+error.message;
    }
    return;
  }
  const key=v.toLowerCase();
  const maps={"es-code":words,"code-es":reverseCode,"es-ja":japanese,"ja-es":reverseJapanese};
  const out=maps[mode.value][key];
  result.textContent=out||"Todavía no conozco esa traducción 🔐";
}
document.getElementById("translate").addEventListener("click",translate);
input.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")translate()});
Object.values(words).forEach(code=>{const div=document.createElement("div");div.className="code-line";div.textContent=code;examplesList.appendChild(div)});
</script></body></html>
